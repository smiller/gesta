<h2>Using Gesta</h2>
<h3>Custom keys</h3>
<table>
<tr><th>Key</th><th>Action</th></tr>
<tr><td>⌃⌘,</td><td>go to the previous entry</td></tr>
<tr><td>⌃⌘.</td><td>go to the next entry</td></tr>
<tr><td>⌃⌘J</td><td>go to entry — open the header’s “Go to” row</td></tr>
<tr><td>⌃⌘K</td><td>search — open the header’s “Search” row</td></tr>
<tr><td>⌃⌘L</td><td>line numbering — open the header’s “Line numbering” row (on a page with verse)</td></tr>
<tr><td>⌃⌘G</td><td>go to a line, or a page number (on a page with a gutter)</td></tr>
<tr><td>⌃⌘T</td><td>go to today’s entry</td></tr>
<tr><td>⌃⌘N</td><td>new — a tagged entry for the day, a sub-page of the page, a book under the author</td></tr>
<tr><td>⌃⌘B</td><td>bookmarks — the pinned entries, and 1-9 to jump</td></tr>
<tr><td>⌃⌘W</td><td>word count — of the selection, or the whole page</td></tr>
<tr><td>⌃⌘S</td><td>insert a custom shortcut</td></tr>
<tr><td>⌃⌘R</td><td>copy a reference to the selected passage</td></tr>
<tr><td>⌃⌘C</td><td>copy a link to this entry</td></tr>
<tr><td>⌃⌘M</td><td>switch between rendered text and markdown source</td></tr>
<tr><td>⌃⌘E</td><td>find and replace in this entry’s markdown</td></tr>
<tr><td>⌃⌘H</td><td>help — open this panel</td></tr>
</table>
<h3>Writing &amp; saving</h3>
<ul>
<li>Each day has one page, and the app opens at today’s. Everything autosaves to this browser’s storage as you type; “saved” whispers in the corner when it lands.</li>
<li>There is no server and no account: entries exist only in this browser. If a save ever fails, the corner pins “not saved” until saving works again — click the notice to copy the error’s details.</li>
</ul>
<h3>Navigating</h3>
<ul>
<li>⌃⌘, and ⌃⌘. step to the previous and next day that has an entry — , and . have &lt; and &gt; as their shifted characters. On a sub-page they step through its brother and sister sub-pages instead, in name order (numbers in reading order: 2 before 10), skipping empty ones — page through a book of sub-pages like days. A today button returns to the current day whenever the open page isn’t today’s; the journal icon in the masthead and ⌃⌘T do the same from any entry.</li>
<li>⌃⌘B opens your bookmarks — the entries you have pinned. Press the number beside a row to go straight there, or click the row. Press A to bookmark whatever you are reading, and the × on a row to remove it. The link button on a row drops a link to that entry in at your cursor, labelled with the entry’s own name — a day by its date, a page by its name, a chapter by its heading — and says why when it can’t: no cursor in the entry, a cursor inside a code block or a link, or the entry you are already reading. The numbers are positions among the rows that have no key of their own, so removing one renumbers the rest. Each row has a key button: press it to give that row a key of its own instead of a number — type a letter b to z, then any letters or digits you like, press Enter, and typing that key takes you there from then on. A key can name what you are going to: scr12, purg19. A digit continues a key you have started and is the numbered jump only when you have not started one. A key nothing else starts with goes on the press. One that could still be the start of a longer key waits, marking the rows it could still reach, until you type the rest of it. Enter takes the marked row when only one is left, or the short key when what you typed is one in its own right; Escape backs out of a half-typed key without closing the list. Rows with a key sit together at the top, and a row that has one gives up its number, so giving a row a key makes room for one more bookmark. Nine numbered rows, and as many keyed ones as you give keys to. Bookmarks are kept on this device only.</li>
<li>⌃⌘J opens the “Go to” row in the header — dropdowns that reach any entry. Its first dropdown picks the destination: Journal, or any page. Under Journal, pick a year and a month, and choosing a day jumps straight there — each day names its entry’s <code>#</code> heading; a day already holding tagged sub-entries offers them in one more dropdown, where choosing a tag jumps to it and “← the day” opens the day. Under a page, choosing a sub-page jumps to it and “← the page” opens the page; a page with no sub-pages jumps the moment you choose it, with no second dropdown. A level holding only ONE sub-page that itself has sub-pages is skipped: its children stand in its place under its name as a heading, with a row for the level itself at the top — so Virgil offers the twelve books of the Aeneid straight away, and gets its middle dropdown back the day a second work arrives. Only the last dropdown in the chain jumps — the ones before it just refill what follows. When arrowing through dropdowns by keyboard, open the list first (Space or ⌥↓) so a jump only commits on Enter. The row closes when you jump, press Escape, or press ⌃⌘J again.</li>
<li>The URL hash addresses entries directly: #2026-01-05 opens that day’s page, #2026-01-05/Ideas its “Ideas” sub-entry.</li>
<li>The date label is prefixed Today, Past, or Future to place the open entry relative to the present day.</li>
<li>When a day’s entry holds a <code>#</code> heading, that heading shows on its own line below the date — the same title row a sub-page uses; a day without one shows no extra line. Only a <code>#</code> heading counts as a day’s title (an <code>##</code> is a section heading), in the header and the Go-to day list alike, and editing the heading retitles the header as you write.</li>
</ul>
<h3>Custom shortcuts</h3>
<ul>
<li>⌃⌘S opens a list of your own shortcuts — short codes that stand in for longer text, handy for phrases you type often or characters that are awkward to reach. Type a code to filter the list, use ↑ and ↓ to choose, and Enter (or a click) drops that text in at the cursor.</li>
<li>Press Edit in the panel to set them up: one shortcut per line as <code>code: expansion</code> — the text before the first colon is the code, the rest is what it inserts. Blank lines and lines starting with # are ignored, and codes are case-sensitive (M and m are different). Shortcuts are kept on this device only.</li>
</ul>
<h3>Search</h3>
<ul>
<li>The header’s “Search” row scans your writing for a phrase and lists the matches with a snippet of each. Open it with ⌃⌘K or by clicking the row itself; ⌃⌘K, Escape, a click outside it, or going anywhere closes it again. Click a result — or press Enter on it — to open that entry with the match selected; Escape then clears the highlight and leaves the caret just after the match. Matching is case-insensitive, and straight and curly apostrophes count as the same character (don't finds don’t). Very common words show only the first 200 matches.</li>
<li>By default a word is found wherever its letters appear, so <code>sister</code> also finds <code>sisters</code> and <code>resisters</code>. Put an underscore at a word’s edge to require a word boundary there: <code>_sister</code> matches only where a word begins, <code>sister_</code> only where one ends, and <code>_sister_</code> the whole word on its own (so it finds <code>sister</code> and <code>sister’s</code> but not <code>sisters</code>). An underscore inside a word stays literal, so <code>_created_at_</code> matches the whole <code>created_at</code>; and because the underscore marks a boundary, you can double it to search for a literal one — <code>__private_</code> finds <code>_private</code>.</li>
<li>The row searches without leaving the entry you are in, and is there on every entry. The dropdown beside its box picks the scope: Everything, Journal — every day and its tagged sub-entries, no pages — All Pages, or any single page, which covers that page together with all its sub-pages, so a common word finds just this book’s uses. Every time you open the row it starts on the book you are reading, or on Journal in a dated entry.</li>
<li>Its results drop below the header, the full width of the window and down to the bottom of the screen. ↑ and ↓ walk the list and wrap at either end, and Enter opens the highlighted match — the top one to start with, so a search is often type-then-Enter. Inside the scope dropdown the arrows still work the dropdown.</li>
<li>Each result names where it lives: a dated entry by its date (and tag), a page by its name, and a sub-page by its title — or by its own name where it has no heading — prefixed with its book unless you have scoped the search to that one book.</li>
</ul>
<h3>Tagged sub-entries</h3>
<ul>
<li>“+ tagged entry” creates a named side-entry for the day, linked from the end of the main entry.</li>
<li>Selecting text and pressing Tag on the toolbar moves the selection into a new tagged entry, leaving a link in its place.</li>
<li>A day’s tagged sub-entries are listed in the masthead under the date. On a sub-entry the masthead reads as a breadcrumb — the date › the sub-entry’s name — with the date linking back to the main entry; the day’s other sub-entries stay listed below, and the masthead offers rename and delete. Sub-entries don’t nest.</li>
</ul>
<h3>Pages</h3>
<ul>
<li>A page is a named entry that belongs to no day — a reference document rather than a diary entry. The paper icon in the masthead lists every page in name order (numbers in reading order: 2 before 10); “New page…” at the bottom asks for a name and opens the new page. On a page the masthead reads the page’s own name — the paper icon and the Go to row are where the other pages list.</li>
<li>Pages are ordinary entries everywhere else: they autosave and back up with the rest, appear in search listed before the dated journal, and export as <code>page/Name.md</code> files that import back. A page’s URL is <code>#page/its%20name</code>, so a link to a page pastes like any entry link.</li>
<li>On a page the masthead offers rename and delete. Renaming keeps the content under the new name (links to the old name elsewhere keep pointing at the old name); deleting removes the page and returns to today. Punctuation that can’t live in a filename (<code>\\ / : * ? " &lt; &gt; |</code>) becomes “-” in a name — except a title’s “: ”, which reads as “ — ” — a double dash becomes a single “-” too (“--” is what separates the parent and sub-page names in an export filename), and a page name caps at about 240 characters (a filename byte limit) — a sub-page has its own full budget, its parent’s length costing it nothing, because each name is a folder or a file of its own — so every page exports under exactly its own name.</li>
<li>A page can hold sub-pages, the way a day holds tagged entries: on a page, “+ sub-page” asks for a name, links the new sub-page from where your cursor sits (a new name asks you to place the cursor when it is elsewhere, or inside a code block or a link; an existing name just opens), and opens it — and the Tag toolbar button moves a selection into a new sub-page the same way. A name can also be a pasted article link: a dated URL (any host’s <code>/2023/11/12/title/</code> shape) names the entry <code>2023-11-12-title</code>, so a book of dated essays keeps chronological order — and this works in every naming prompt, renames included (a dated link whose title can’t be a name says so instead of naming the page after the URL). When a sub-page opens with a heading, the parent’s link to it takes that heading as its label (a label you wrote yourself stays). A sub-page can hold sub-pages of its own, as deep as you like — “+ sub-page” is there on every page — the same name can live under different pages, and a sub-page’s URL is <code>#page/parent/name</code> (<code>#page/a/b/c</code> deeper down). Sub-pages back up, search, and export (as <code>page/Parent/Sub.md</code>) like any entry — but the paper icon lists only the pages themselves: a sub-page is reached through its parent’s links, search, or a pasted link. The header’s “Go to” row lists a page’s sub-pages — pick one to jump there; on a sub-page it switches between siblings the same way. Sub-pages list in name order — except a book whose sub-page names all open with a date, which lists newest first in the Go-to row (the ⌃⌘,/. walk stays oldest-to-newest).</li>
<li>On a sub-page the masthead reads as a breadcrumb — the parent’s name › the sub-page’s name, and deeper down the whole parent path › the name — with the parent crumb linking back one level at a time. When the sub-page has a heading, that heading shows on its own line below, so a book essay imported under a number shows its title (in the header, the Go-to lists, and search results); the name stays its address. The header shows that title in full, however long, while the Go-to lists and search results shorten it to fit a row. Rename and delete work as on a tagged entry, and deleting returns to the parent page. A page whose sub-pages still hold content refuses rename and delete until they are deleted.</li>
</ul>
<h3>The bookshelf</h3>
<ul>
<li>The book icon in the masthead lists the bookshelf — imported books, kept beside the journal rather than in it. Each row of the list is an author, and what sits under an author is a book, which reads and edits like any other entry and holds its own parts as deep as they go — Gesta calls those parts books too, in every prompt and confirmation. Most arrive by import; “New author…” at the bottom of the list asks for a name, then where it sorts — “Sorted under:” holds the surname first (“Price, Harley” for “Harley Price”), which Enter takes or you edit — and opens an empty page headed by the name, to write or paste into; “+ book” on an author adds a book beneath it. An author is listed and named by the heading on its own first page, not by the name it is filed under — so one stored as “Milton, John”, which is what sorts the shelf by surname, reads as “John Milton” in the bookshelf list, the go-to and search rows, the breadcrumb and a copied link. Edit that heading and every one of them follows. Rename on an author re-files it, books and all: every link to it, anywhere, follows, and the heading stays; a link that could not be updated is named in the corner, to fix by hand. Pages are unchanged: a page is named by the name you gave it. The list can be sorted onto shelves — Latin, Old English, English — by an entry of the bookshelf’s own, Shelves, opened from “Shelves…” at the foot of the list, which makes it the first time: each <code>##</code> heading on it is a shelf, in the order the list shows them, and the authors linked under it sit on that shelf; the shelf with no authors linked under it takes everyone not listed, a new author included. The list heads each shelf and sets its authors in beneath it, and the go-to and search rows group them the same way; a shelf of more than one author opens its group in the search row with “All Latin” (or whatever the shelf is called), which searches every author on it at once. A shelf only gathers: an author’s address, its links and how it is cited stay as they were, and renaming an author carries its link on the Shelves page with the rest. Shelves is no author: it holds no books, keeps its name, and no author can be filed under it.</li>
<li>A book's contents page — a book below its author that holds parts of its own — folds under its <code>##</code> headings: each opens closed, showing how many entries it holds, so a long contents fits on a screen. The small triangle in the margin before a heading opens and closes it; the heading's words stay editable as ever. Gesta remembers, in this browser, which sections you left open, and coming back to the page shows it as you left it, scrolled to the link you followed from it. A search result or a highlighted link that lands inside a closed section opens it. An author's page does not fold, and the text is never changed: the source view shows it whole.</li>
<li>A bookshelf entry is an ordinary entry with one difference. A link into the bookshelf that no longer exists says “no such author” or “no such book”, naming whichever is actually missing — a dead link to a renamed author says so, rather than blaming the book you were after — and leaves you exactly where you were reading, instead of quietly making a blank entry under that name — unlike a page, which is created by visiting its address.</li>
<li>Verse — a play, a poem, an extract in a journal entry or on a page — shows line numbers in a gutter down the left. What is verse is the <code>::: verse</code> fence and nothing else: every line inside one is numbered, starting with 1 — or with the number you write on the fence, <code>::: verse 2</code> numbering its first line 2 — and everything outside it is prose. That is what lets a poem carry an argument above it and notes below it — neither takes a number. How often the numbers appear is yours to choose: the header’s “Line numbering” row — open it with ⌃⌘L or by clicking the row, and it appears only on a page that draws a gutter — offers line numbering options, and the gutter stays the same width whichever you pick, so the words never move. Closing the row puts your cursor back where it was. The numbers are counted fresh every time the page is drawn and are never part of the text: they are not stored, not copied with a passage, not searched, and not counted in the word count. Speaker names and stage directions are not lines, so they take no number — a line all in bold is a speaker, a line all in italic a stage direction, wherever in the verse they fall — except in a stanza, where every line is a line. A line of verse split between speakers — Samson’s “Relate by whom.” / “By Samson.” / “That still lessens” — stays one line: begin each later part, in the markdown source, with <code>⟨…⟩</code>, and it is set in just past where the part above it ends and takes that line’s number, so the lines after it keep the numbers editions give them. A line an edition leaves out but still counts — the Loeb’s Ovid has no line 546 in Book 1, its margin going from 545 to 547 — is a row of its own reading <code>⟨skipped line number⟩</code> in the source: nothing is drawn for it, and it takes its number, so the line after it is 547. Asking ⌃⌘G for 546 lands on 547 and says that line 546 is omitted in this edition. Two poems set side by side, each with its own numbering — Ovid’s Latin beside Golding’s verse translation — take a second number on the fence, <code>::: verse 179 244</code>: the second is the right column’s first line, and its numbers are drawn down the right. A row with nothing before its <code>|</code> is the right column’s alone and takes no number on the left; a row with no <code>|</code> is the left’s alone. In such a block ⌃⌘G goes by the right column’s numbers, and ⌃⌘R (or Ref in the bar over a selection) quotes the right column alone, as verse numbered from its first line, and cites both, <em>Ovid, Metamorphoses, 7.197-209 (Golding, 7.265-77)</em>, the translator named by the work’s heading, “Metamorphoses (with Golding’s translation)”; the bar’s Ref (all), shown only there, quotes both columns. On a page whose heading names no translation the right column’s lines alone are cited. A page with no verse block gets no gutter and no numbers at all.</li>
<li>A book of prose carries page numbers instead of line numbers. Where a page turns, <code>⟨15⟩</code> marks the spot — that is what the source view shows — and the reading view draws a small “p. 15” in the gutter beside the line the new page begins on, with a hairline at the word it begins with. Like a line number it is not part of the text: a phrase running across a page break is found by search like any other, it takes no word count, and it is not copied with a passage. Unlike a line number it is stored, because a printed page number cannot be worked out from the words — it has to be recorded. To add page numbers to a book already imported, switch to the source view and add the number in angle brackets (e.g. <code>⟨15⟩</code>) just before the first word on p. 15.</li>
<li>On an entry whose lines or sentences are numbered — with a gutter or without one — ⌃⌘G opens a small bar at the top right: type a line number, press Enter, and Gesta takes you to that line and marks it while the bar is open. Every <code>::: verse</code> block counts from 1 — or from the number on its fence — so a page holding two of them may have two line 1s — Enter again with the same number goes on to the next block that has that line, and round to the first after the last, and Gesta says which block you have landed in whenever there is more than one. In a book of prose the bar asks for a page number instead — type <code>138</code>, or a roman numeral like <code>xxiv</code> for front matter. A book with both kinds of number gets a box for each, labelled Line and Page, so there is never a prefix or a spelling to remember: the box you type in is the number you mean. Each box keeps whatever you type — until you open the bar on a different entry, where both start empty, a line or page number meaning a different place in every text — and Enter tells you what is wrong with what is there: roman and arabic mixed in one number is refused as such, and anything that is not a number for that box is named back to you. A page number names one place, so Enter again stays where it is. Escape, or the bar’s ×, closes it and leaves your cursor where you stopped: at the start of the line, or at the first word of the page. Clicking anywhere outside the bar closes it too, and leaves your cursor wherever you clicked. On a page written in stanzas — the Faerie Queene, Hávamál — the Line box takes a stanza and a line instead: <code>2</code> goes to stanza 2, <code>2.1</code> to its first line, and a stanza number names one place, so there is nothing to cycle. A number the page has no line for is refused with the range of lines there are — except one below 1, which is named back instead — and a page number the book has no mark for is refused by name — page numbers neither start at 1 nor mark every turn, so there is no count to give. The marking, like the numbers themselves, is never stored, copied or searched.</li>
<li>Book pages export as <code>bookshelf/Book/Part.md</code> and import back the same way. Their URLs read <code>#bookshelf/book/part</code>, so a link to one pastes like any entry link, and search reaches them under Everything or under that book’s own row in the scope dropdown.</li>
</ul>
<h3>Markdown as you type</h3>
<ul>
<li>Inline, converted on the closing marker: <code>**bold**</code>, <code>*italic*</code>, <code>~~strikethrough~~</code>, <code>\`code\`</code>.</li>
<li>At the start of a line, followed by a space: <code>#</code> heading, <code>##</code> subheading, <code>&gt;</code> quote, <code>&gt;&gt;</code> nested quote, <code>-</code> bullet, <code>1.</code> numbered list. Any number works, and the list opens at it, so a countdown can start at <code>18.</code> and run down. A <code>-</code> or a number on a fresh line inside a quote starts a list within the quote, and a <code>#</code> or <code>##</code> starts a heading within it.</li>
<li>A list item can carry more than its own line. In the markdown view, indent a line by four spaces to hang it under the item above rather than ending the list: run straight on from the item's line for a second line of the same paragraph, or leave a blank line first to start a fresh paragraph under the item. Several may hang under one item, and consecutive indented lines stay one block, so a quoted verse keeps its line breaks. The rule is "at least as far as the item's own text", so four spaces cover every marker up to four characters wide and a countdown crossing from <code>14.</code> to <code>9.</code> takes the same indent throughout; a wider marker — <code>100.</code>, or a year read as a number — needs as many spaces as its own text is set in. Inside a quote the spaces go after the <code>&gt;</code>. Once an item has a block hanging under it, Enter inside that block starts another one under the same item, and Enter again on the empty block steps out to a new item — so a run of them can be written without leaving the rendered view.</li>
<li>A line of <code>\`\`\`</code> (optionally <code>\`\`\`ruby</code>, <code>\`\`\`js</code>, …) plus Enter starts a code block with syntax highlighting, a corner language label, and a copy button on hover. A code block can also sit inside a quote — in the source, keep the <code>&gt;</code> on the fence lines and every code line.</li>
<li>Hovering a quote shows a copy button too, which copies the whole quote as markdown — its <code>&gt;</code> markers, everything nested inside, and any pictures — ready to paste on another page. A code block, or any <code>:::</code> block, inside the quote keeps its own button: whatever the mouse is innermost over wins. A grid of cards has a button of its own, <code>copy grid</code>, which appears when the mouse comes to just above the grid’s top-right corner or into a gap between its cards; each card inside keeps its own.</li>
<li>A copied quote or card also carries its formatting for everywhere else: paste it into an email or a document and it arrives as a quote, or as its coloured box or ruled note, pictures and all, rather than as the markdown text. Whichever form the destination understands is the one it takes.</li>
<li><code>--</code> between spaces becomes an em-dash as you type; straight quotes curl as you type — type the quote again to step it: a closing curl escapes back to a straight one, and an opening <code>'</code> flips to a right single quote (the leading apostrophe in ’tis).</li>
<li>A bare URL becomes a link when finished with space or Enter, and <code>[title](url)</code> becomes a titled link when you type the closing paren. ⌘-click (Ctrl-click) opens a link in a new tab; a plain click on a link to an entry or page — including a full URL copied from the address bar — follows it in the same tab. A link to the entry you are already reading says so and puts your cursor back, rather than doing nothing at all.</li>
<li>Pasting several lines of text renders them as the Markdown they spell — a copied card, heading, list, table, or grid of cards arrives formatted, and two cards copied out of a grid arrive in a grid of their own. A single pasted line stays as typed, unless it is a quote — <code>&gt;</code> and a space and some words — or a heading — <code>#</code> or <code>##</code> and a space and some words — which arrives as one; a single line copied from the rendered view of an entry arrives as the Markdown it carries — an italic title in italics; anything pasted into a code block stays literal; inside a list or a table the lines arrive as plain line breaks; inside a quote they arrive as what they would mean written under the quote’s own <code>&gt;</code> markers — a copied card, list, heading, or table as that block inside the quote, prose as line breaks; and the source view keeps pasted Markdown literal (it converts when you switch back).</li>
<li>Copying a selection from the rendered view puts its Markdown on the clipboard beside the formatted text, so a list, a heading, a card or an italic title pasted into another entry arrives as itself. A drag from inside one bullet, cell or verse line into the next copies as the list, table or verse block those parts came from; only a selection inside a code block copies as the browser would.</li>
</ul>
<h3>Selection toolbar</h3>
<ul>
<li>Selecting text floats a formatting toolbar: bold (⌘B), italic (⌘I), underline (⌘U), strikethrough, heading, quote, code block, curl quotes, Ref, Words, and Tag. Inside a code block it offers only the code-block button, which takes the block back to ordinary text; the quote and heading buttons actively damage code, and nothing else there is worth the room.</li>
<li>The curl-quotes button — or ⌘' (Ctrl-') — turns every straight quote in the selection into a curly one, handy for text pasted in from elsewhere; it also turns <code>--</code> into em-dashes, closes a quote that ends speech after a dash (<code>“stop—”</code>), and right-singles a leading elision (<code>’tis</code>).</li>
<li>The Ref button — or ⌃⌘R — copies a reference to the selected passage, ready to paste into a journal entry: the source named the way a reader would write it, as a link straight back to the passage, with the passage quoted underneath — verse as a verse block numbered from its first line, two languages side by side as they stand, the lines of a stanza and prose as plain quoted lines. A journal entry cites as its date and a page as its title, and nothing more. In a book the line numbers of the selection go into the name; in a book of prose the page numbers do instead — <code>pp. 22-25</code>, or <code>p. 22</code> where the passage stays on one page, read from the page it is on rather than from any marker inside it, so a passage in the middle of a page still cites that page. Where the chapter has a number of its own — Letter 12, chapter 9 — that number is the citation and the page numbers drop out; a chapter with only a title drops out itself — along with any numbered level above it, so a chapter of a numbered book leaves both behind — and lets the page numbers stand in. A printed citation gives the chapter or the page, never both. A passage with neither simply carries no numbers. A name at the top of the bookshelf that gathers works rather than naming their author — Old English — says so on its own page with <code>::: reference</code>, <code>no author</code>, <code>:::</code>, and its works are cited by their own titles alone: <em>Beowulf</em>, 50-52. A work of Old English verse cites its half-lines, as its editions do: its page says <code>Old English verse</code> on a line of its own in the same box — on a name of works with no author it reaches all of them — and each line holds its two halves two spaces apart, so a selection inside one half cites it as <em>Beowulf</em>, 50a or 50b, a run that starts on a second half or ends on a first as 50b-52 or 49-50a, and both halves of a line as the line; in a work with its translation beside it the original’s halves count, and the translation’s words cite the line. A selection that crosses two verse blocks is refused — reference them one at a time — except across stanzas: a passage in stanzas cites the stanza as well as the line — <em>Hávamál</em>, 76.1-3 for lines, 76 for a whole stanza, 76–77 for whole stanzas, 76.4–77.2 for a run across them — and in the Faerie Queene the book and canto before them, <code>I.i.2.1</code>. Pasted onto a selection inside one paragraph or line — a line number, a word — a reference makes the selection a link to the passage rather than pasting itself whole; a copied entry link does the same. Pasted into a line that already has words in it, a reference arrives as its citation alone, a link with no colon after it, for a sentence that quotes the text itself; on an empty line it arrives whole.</li>
<li>⌃⌘C copies a link to the entry you are reading — the reference’s heading line with nothing quoted under it, named the same way — ready to paste into another entry, or anywhere else as a link. It works from either view.</li>
<li>The Words button whispers the word count of the selection; ⌃⌘W does the same from the keyboard — and with nothing selected, counts the whole page. The key works in the markdown source view too, where the count skips the markdown markers.</li>
</ul>
<h3>Images</h3>
<ul>
<li>Paste an image to insert it; it is downscaled, recompressed, and kept in this browser, with the entry holding only a small reference to it.</li>
</ul>
<h3>Markdown source view</h3>
<ul>
<li>⌃⌘M toggles the page between rendered text and its markdown source; both views are editable. The rendered text is the default: the markdown view lasts while you stay on that entry, and the next entry you open is rendered. Inline images appear in the source as <code>![](name.webp)</code> references to the pictures filed beside the entry, and can be moved, duplicated, or deleted.</li>
<li>⌃⌘E opens find and replace. ⌃⌘R is already used for references, so ⌃⌘E (for exchange) is used for replace. It works on the markdown, so from the rendered view it switches to the source first — “Source view, to replace” whispers in the corner — and closing the bar (Escape, or the ×) switches back. Type into Find and the count shows which match is outlined, “2 of 7”; Enter goes to the next, Shift+Enter the previous. Type the new text into Replace with: Skip leaves the outlined match as it is and goes on to the next; Enter in Replace with, or the Replace button, replaces it and goes on; Replace All replaces every one in the entry. The match is exact — the same characters, capitals counting. ⌘Z in the text undoes one replacement, or the whole of a Replace All at once. Replacing works on the open entry only.</li>
<li>The toggle keeps your place. Switching there and back puts the caret where you left it. A first switch into a view, or one taken after editing in the other, matches the two texts up and carries your place across instead — close, but not always to the character, wherever the markdown and what it renders differ most.</li>
<li>A table written in the source — a header row, a <code>| --- | --- |</code> divider, then the body rows — renders as a table when you switch back, and imported entries carry their tables in. A table can also sit inside a quote — keep the <code>&gt;</code> on each row.</li>
<li>A bullet (<code>-</code>) or numbered (<code>1.</code>) list nests: indent an item two spaces per level in the source, and the sub-list survives the switch back to rendered text. A list can also sit inside a quote — keep the <code>&gt;</code> on each item line.</li>
<li>A line of prose that would otherwise read as markdown carries a leading <code>\\</code> in the source view — one starting <code>-</code>, <code>*</code>, <code>1.</code>, <code>#</code>, <code>&gt;</code>, <code>\`\`\`</code> or <code>:::</code>, or one indented under a list. The backslash Gesta writes marks the line as text and never shows in the rendered view; delete it and the line becomes the list, heading or quote it looks like.</li>
<li>A run of text fenced by <code>::: card-light-green</code> … <code>:::</code> renders as a coloured card box; the colour is the fence word — <code>card-</code> plus bright-yellow, brighter-yellow, light-yellow, light-green, bright-green, light-blue, bright-blue, red, pink, light-purple, or orange — and the lines inside are ordinary markdown. A card can also sit inside a quote — keep the <code>&gt;</code> on the fence lines and every line inside. Hovering a card shows a copy button that copies the whole card as markdown, fences included, ready to paste on another page.</li>
<li>Cards fenced by <code>::: grid</code> … <code>:::</code> lay out side by side, three across, or as many across as the number after the word — <code>::: grid 2</code>, <code>::: grid 4</code> — the rows falling out of the count; the grid widens past the page’s measure to fit them, no card wider than a hand’s span, and on a narrow window the count steps down. A grid holds cards and nothing else: a line of prose between them, a card without a colour, or no cards at all, and the page opens in the source view with the corner naming the line, so you can fix it there and switch back (⌃⌘M). The text inside a card edits in place; the grid’s shape — adding or removing a card, changing the count — is edited in the source view, where the fences are, and a <code>::: grid</code> line typed into the rendered view stays text, as every fence does. A grid can sit inside a quote, a note, or a card, where it keeps its container’s width.</li>
<li>A run of lines fenced by <code>::: verse</code> … <code>:::</code> is verse, one line per line. Split a line with a <code>|</code> to set an original beside its translation, and write <code>\\|</code> for a pipe you want to keep inside a line; a line with no pipe runs the full width, so a speaker name or a stage direction can stand among paired ones. A blank line inside the fence is a stanza break. Write a number after the word — <code>::: verse 2</code> — and the block’s first line is line 2, which is how lines copied out of the middle of a poem keep their numbers: a copy of lines 2 and 3 writes that fence itself, and so does the Reference button when it copies a paired block as its own fence. A fence with a number Gesta cannot read, or a <code>:::</code> word it does not know, stays a paragraph and says why. An entry holding a block with translations is set wider than an ordinary one, and set to the width its longest line and translation actually need rather than to a fixed wide measure — so two entries rarely have the same width, and the prose around the block always has the width the block has. Hovering verse shows a copy button that copies the whole block as markdown, fences included; pasted somewhere that takes formatting, a paired block keeps its two columns rather than interleaving the languages. Verse can also sit inside a quote — keep the <code>&gt;</code> on the fence lines and every line inside.</li>
<li>A poem in stanzas whose lines are cited within each stanza — the Faerie Queene, Book I, Canto i, stanza 2, line 1; Hávamál, stanza 76, line 1 — writes each stanza as its own fence, <code>::: stanza 2</code> … <code>:::</code>, the number written on the fence and required. The stanza's lines count from 1, every one of them a line, even one set all in italic, and the stanza's number stands in bold in a column left of the line numbers, whatever the line numbering is set to — and at the edge of a note, a quote or a card that holds a stanza, as the 1590 stanzas a note keeps after a canto do. A reference names the stanza and the line, 76.1. A work can add its books and cantos: its contents page carries <code>::: reference</code>, <code>roman book and canto</code>, <code>:::</code>, and its entries are keyed <code>1.1</code>, <code>1.pr</code> for a proem, and so on — then a reference reads <code>I.i.2.1</code>, the book in capitals and the canto in lower case, and the masthead names the entry the same way. A passage copied from the middle of a stanza is written as a plain <code>::: verse</code> fence numbered from where it starts, the citation beside it naming the stanza.</li>
<li>A run of lines fenced by <code>::: prose</code> … <code>:::</code> is text-and-translation prose, one sentence per line. Split a line with a <code>|</code> to set the original beside its translation, and write <code>\\|</code> for a pipe you want to keep inside a sentence, in two equal columns at the wide measure; the sentences of a paragraph sit close together, and a line holding only a <code>|</code> — or a blank line — is a paragraph break, drawn as a wider space with a faint rule across it. A line with no pipe runs the full width. In a book, paired sentences count from 1 — or from the number on the fence, <code>::: prose 2</code> — for ⌃⌘G and for references, but the numbers are never drawn in the margin and the page keeps an ordinary left edge. Hovering the block shows a copy button that copies it as markdown, fences included, and a selected passage copied as a reference keeps both columns. Prose can also sit inside a quote — keep the <code>&gt;</code> on the fence lines and every line inside.</li>
<li>A run of text fenced by <code>::: note</code> … <code>:::</code> is a note — a footnote, or the argument standing at the head of a book — set smaller and ringed by a thin rule. The lines inside are ordinary markdown, and a <code>::: verse</code> fence can sit inside one, so a footnote can quote a poem. A note sits outside the numbering entirely: verse inside one takes no line numbers, a leaf marker inside one draws no page number and turns no page, and ⌃⌘G will not land there — write a leaf you want to show as ordinary text inside the note. An entry whose only verse is inside a note draws no line-number margin at all. A note can also go the other way round, INSIDE a <code>::: verse</code> or <code>::: prose</code> block: write the fence on its own line among the block's lines. The block does not end there, so the line or sentence after the note carries on counting rather than starting again at 1 — which is what a footnote in the middle of a text needs. The note takes no number of its own, runs the full width of the block with its left edge on the text's, and is left out of a passage copied as a reference. Hovering a note shows a copy button that copies the whole note as markdown, fences included; pasted somewhere that takes formatting, it arrives as its ruled, smaller box. A note can also sit inside a quote — keep the <code>&gt;</code> on the fence lines and every line inside.</li>
<li>A note printed in a book’s margin — a margin-note — is fenced by <code>::: margin-note</code> … <code>:::</code>, written on its own line just before the line it stands beside — inside a <code>::: verse</code> or <code>::: prose</code> block among its lines, or between two paragraphs, where it stands beside the paragraph after it. Where the window leaves room, it is set in the left margin, outside the line numbers, in small muted italic, right-aligned and level with that line; with less room it narrows, and where there is too little it drops back into the text where it stands, still small and italic, with no rule around it. A margin-note that would overlap the one above it is moved down below it. Inside a grid’s card it always stays in the text, since a card can have another beside it. Like a note, it takes no line number, the lines around it count on as if it were not there, it is left out of a passage copied as a reference (a selection wholly inside one is refused), and a leaf marker inside it turns no page. You edit it where it is drawn, in the margin or in the text: click into it, or reach it with the arrow keys from the line before or after it.</li>
</ul>
<h3>Enter</h3>
<ul>
<li>Enter starts a new paragraph; Shift+Enter breaks the line. On an empty last line, Enter steps out of a quote, code block, card, verse block, note, or margin-note; in the last card of a grid it steps out of the grid too, and in any other card of a grid it adds a line, since the grid holds its cards in place — Backspace at a card’s start and Delete at its end inside a grid say so rather than joining two cards, and Enter on an empty line in the middle of a card splits it into two cards of the same colour. Enter at the end of a heading inside a quote starts a fresh line in the quote.</li>
</ul>
<h3>Tab</h3>
<ul>
<li>In a list, Tab nests the item under the one above it and Shift+Tab lifts it back out; the item’s own sub-list and any paragraphs hanging under it travel with it, and the items below an outdented one follow it down a level, so the order you see never changes. Select several items and they all move together — write a flat list first, then select the ones that belong under the item above them and press Tab once. An item can never sit more than one level deeper than the one above it, so Tab on the first item of a list does nothing — there is nothing above to nest under — and neither does a second Tab on an item already nested under its neighbour. Shift+Tab at the outermost level does nothing either. Each of them says so in the corner. To leave a list altogether, switch to markdown (⌃⌘M) and delete the marker. Shift+Tab straight after Tab always puts things back, the one exception being a numbered item that opened a fresh sub-list — that counts from 1, and the number it had is gone.</li>
<li>In a quote, Tab pushes the paragraph the caret is in one level deeper and Shift+Tab lifts it back out. The whole run of lines between the blank lines around it moves, so a quote of several paragraphs deepens a paragraph at a time; select across a blank line to move more than one. A heading, table, card, or grid inside a quote moves as the one thing it is, and a list inside a quote indents as a list — the innermost thing the caret is in always wins. Shift+Tab on an outermost quote does nothing and says so; to leave a quote altogether, switch to markdown (⌃⌘M) and delete the <code>&gt;</code>.</li>
<li>In a code block, and in the markdown source view, Tab inserts two spaces and Shift+Tab takes up to two back off. With text selected, both work on whole lines instead: every line the selection touches shifts together, and stays selected so you can press again. ⌘A inside a code block selects just that block, so Tab can indent the whole of it; press ⌘A again for the whole page.</li>
<li>A selection that reaches outside one list, quote, or code block has nothing Tab can do to it as a whole, so Tab leaves it alone and says so — select within the one you mean.</li>
<li>Anywhere else — in plain prose — Tab stays in the entry and reminds you that ⌃⌘M toggles markdown. Holding Tab down acts once.</li>
</ul>
<h3>Exporting</h3>
<ul>
<li>“export” writes every entry to Markdown files, in the folders that carry their keys — a day under <code>journal/&lt;year&gt;/</code>, a page under <code>page/</code>, a book under <code>bookshelf/</code>. Pasted images are saved beside each page as their own files and linked from it, so the Markdown renders anywhere. You pick the folder to fill and Gesta writes its own files into it, replacing any that have the same name. It needs a browser that can open a folder to write into (Helium or Chrome); where none is offered it writes nothing and says so, rather than leaving behind a folder that cannot be read back.</li>
<li>“import” reads an exported folder back in, and recreates all the exported entries, with their images. The main use case is to populate a new empty Gesta instance with all the entries. Import reports how many entries it will import before writing anything: if the number looks wrong, press cancel to prevent import from doing anything.</li>
</ul>
<h3>Backups</h3>
<ul>
<li>Point Gesta at a folder once, from “backups” → “set up automatic backups…”, and it writes the whole journal there by itself — a live copy kept current, plus dated <code>.zip</code> archives of whatever changed. The live copy is a true mirror: an entry you delete or rename leaves it too, so restoring from it brings back the journal as it stands rather than every state it has ever been in. The archives are the memory it deliberately lacks: one per author, per page, and per year of the journal, written at most once a day and only for what actually moved, so a book you have not opened in months costs nothing and never loses its older copies. They sit beside the live copy as <code>archive/bookshelf/&lt;author&gt;/&lt;date&gt;.zip</code>, <code>archive/page/&lt;name&gt;/&lt;date&gt;.zip</code> and <code>archive/journal/&lt;year&gt;/&lt;date&gt;.zip</code>. It backs up on launch and occasionally as you write, only when something changed — and leaving the tab with a backup still pending writes it right away, rather than waiting for a quiet moment that may never come. This needs a Chromium browser (Helium or Chrome) — and so does “export”, which writes into a folder you pick, so elsewhere neither is available. Opened as a file on disk, the browser asks once a session before it may write — the “backups paused — click to resume” note in the corner is that one click.</li>
<li>To roll back, import: each archive is a complete copy of one author, one page, or one year of the journal as it stood that day, so recovering an old state means unzipping the ones you want and importing them into a fresh, empty Gesta, a new browser profile or another browser, never this journal (import overwrites entry by entry and deletes nothing, so over live data it mixes old and new instead of rolling back). Which archives to unzip is what <code>archive/manifests/&lt;date&gt;.txt</code> answers: one line per author, page or year that existed that day, naming the archive holding it — so a book you deleted last month is simply absent from that day’s list rather than quietly restored alongside everything else. For one ruined entry, open its <code>.md</code> file inside the unzipped folder — a day sits under <code>journal/&lt;year&gt;/</code>, a page under <code>page/</code> — and copy the text back.</li>
</ul>
<h3>More than one tab</h3>
<ul>
<li>Each tab keeps its own copy of the journal, and the tabs keep one another in step: when one saves or deletes an entry, the others take the change at once. An entry open in another tab is redrawn there with the new text — unless that tab has typing not yet saved, which is left alone. That typing's save is then refused, and the corner says “not saved — changed in another tab, copy your text then reload”: copy it out before you reload or move away, either of which discards it, and reload to see the newer text. An entry open in one tab and deleted in another stays on screen, and the corner says “deleted in another tab”; anything typed there is not saved, and the corner says “not saved — deleted in another tab, copy your text”. The habit that avoids all of this is still to keep one tab on whatever you are writing in; ⌘-click opens a link in a second tab, which is for reading.</li>
<li>Renaming from a tab whose save was just refused leaves two entries rather than one. The new name is created from the text that tab was holding, and clearing the old name is refused like any other overwrite — so the newer text stays where it was, under the name you were renaming away from. The corner says “not deleted — changed in another tab, reload”. Reload, check which of the two reads correctly, delete the other, and rename again.</li>
</ul>

::: verse
Maecenas atavis edite regibus, | Maecenas, born of monarch ancestors,
o et praesidium et dulce decus meum, | The shield at once and glory of my life!
sunt quos curriculo pulverem Olympicum | There are who joy them in the Olympic strife
collegisse iuvat metaque fervidis | And love the dust they gather in the course;
evitata rotis palmaque nobilis | The goal by hot wheels shunned, the famous prize,
terrarum dominos evehit ad deos; | Exalt them to the gods that rule mankind;
hunc, si mobilium turba Quiritium | This joys, if rabbles fickle as the wind
certat tergeminis tollere honoribus; | Through triple grade of honours bid him rise,
illum, si proprio condidit horreo | That, if his granary has stored away
quicquid de Libycis verritur areis. | Of Libya’s thousand floors the yield entire;
Gaudentem patrios findere sarculo | The man who digs his field as did his sire,
agros Attalicis condicionibus | With honest pride, no Attalus may sway
numquam demoveas, ut trabe Cypria | By proffered wealth to tempt Myrtoan seas,
Myrtoum pavidus nauta secet mare. | The timorous captain of a Cyprian bark.
Luctantem Icariis fluctibus Africum | The winds that make Icarian billows dark
mercator metuens otium et oppidi | The merchant fears, and hugs the rural ease
laudat rura sui; mox reficit rates | Of his own village home; but soon, ashamed
quassas, indocilis pauperiem pati. | Of penury, he refits his battered craft.
Est qui nec veteris pocula Massici | There is, who thinks no scorn of Massic draught,
nec partem solido demere de die | Who robs the daylight of an hour unblamed,
spernit, nunc viridi membra sub arbuto | Now stretched beneath the arbute on the sward,
stratus, nunc ad aquae lene caput sacrae. | Now by some gentle river’s sacred spring;
Multos castra iuvant et lituo tubae | Some love the camp, the clarion’s joyous ring,
permixtus sonitus bellaque matribus | And battle, by the mother’s soul abhorred.
detestata. Manet sub Iove frigido | See, patient waiting in the clear keen air,
venator tenerae coniugis inmemor, | The hunter, thoughtless of his delicate bride,
seu visa est catulis cerva fidelibus, | Whether the trusty hounds a stag have eyed,
seu rupit teretis Marsus aper plagas. | Or the fierce Marsian boar has burst the snare.
Me doctarum hederae praemia frontium | To me the artist’s meed, the ivy wreath
dis miscent superis, me gelidum nemus | Is very heaven: me the sweet cool of woods,
Nympharumque leves cum Satyris chori | Where Satyrs frolic with the Nymphs, secludes
secernunt populo, si neque tibias | From rabble rout, so but Euterpe’s breath
Euterpe cohibet nec Polyhymnia | Fail not the flute, nor Polyhymnia fly
Lesboum refugit tendere barbiton. | Averse from stringing new the Lesbian lyre.
Quod si me lyricis vatibus inseres, | O, write my name among that minstrel choir,
sublimi feriam sidera vertice. | And my proud head shall strike upon the sky!
:::`,pippa:`# Pippa Passes, Introduction (an extract)

::: verse
*A large mean airy chamber. A girl, PIPPA, from the silk-mills, springing out of bed.*

DAY!
Faster and more fast,
O’er night’s brim, day boils at last:
Boils, pure gold, o’er the cloud-cup’s brim
Where spurting and suppressed it lay,
For not a froth-flake touched the rim
Of yonder gap in the solid gray
Of the eastern cloud, an hour away;
But forth one wavelet, then another, curled,
Till the whole sunrise, not to be suppressed,
Rose, reddened, and its seething breast
Flickered in bounds, grew gold, then overflowed the world.

Oh Day, if I squander a wavelet of thee,
A mite of my twelve-hours’ treasure,
The least of thy gazes or glances,
(Be they grants thou art bound to or gifts above measure)
One of thy choices or one of thy chances,
(Be they tasks God imposed thee or freaks at thy pleasure)
—My Day, if I squander such labor or leisure,
Then shame fall on Asolo, mischief on me!

Thy long blue solemn hours serenely flowing,
Whence earth, we feel, gets steady help and good—
Thy fitful sunshine-minutes, coming, going,
As if earth turned from work in gamesome mood—
All shall be mine! But thou must treat me not
As prosperous ones are treated, those who live
At hand here, and enjoy the higher lot,
In readiness to take what thou wilt give,
And free to let alone what thou refusest;
For, Day, my holiday, if thou ill-usest
Me, who am only Pippa,—old-year’s sorrow,
Cast off last night, will come again to-morrow:
Whereas, if thou prove gentle, I shall borrow
Sufficient strength of thee for new-year’s sorrow.
All other men and women that this earth
Belongs to, who all days alike possess,
Make general plenty cure particular dearth,
Get more joy one way, if another, less:
Thou art my single day, God lends to leaven
What were all earth else, with a feel of heaven,—
Sole light that helps me through the year, thy sun’s!
Try now! Take Asolo’s Four Happiest Ones—
And let thy morning rain on that superb
Great haughty Ottima; can rain disturb
Her Sebald’s homage? All the while thy rain
Beats fiercest on her shrub-house window-pane
He will but press the closer, breathe more warm
Against her cheek; how should she mind the storm?
And, morning past, if mid-day shed a gloom
O’er Jules and Phene,—what care bride and groom
Save for their dear selves? ’T is their marriage-day;
And while they leave church and go home their way,
Hand clasping hand, within each breast would be
Sunbeams and pleasant weather spite of thee.
Then, for another trial, obscure thy eve
With mist,—will Luigi and his mother grieve—
The lady and her child, unmatched, forsooth,
She in her age, as Luigi in his youth,
For true content? The cheerful town, warm, close
And safe, the sooner that thou art morose,
Receives them. And yet once again, outbreak
In storm at night on Monsignor, they make
Such stir about,—whom they expect from Rome
To visit Asolo, his brothers’ home,
And say here masses proper to release
A soul from pain,—what storm dares hurt his peace?
Calm would he pray, with his own thoughts to ward
Thy thunder off, nor want the angels’ guard.
But Pippa—just one such mischance would spoil
Her day that lightens the next twelvemonth’s toil
At wearisome silk-winding, coil on coil!
And here I let time slip for naught!
Aha, you foolhardy sunbeam, caught
With a single splash from my ewer!
You that would mock the best pursuer,
Was my basin over-deep?
One splash of water ruins you asleep,
And up, up, fleet your brilliant bits
Wheeling and counterwheeling,
Reeling, broken beyond healing:
Now grow together on the ceiling!
That will task your wits.
Whoever it was quenched fire first, hoped to see
Morsel after morsel flee
As merrily, as giddily ...
Meantime, what lights my sunbeam on,
Where settles by degrees the radiant cripple?
Oh, is it surely blown, my martagon?
New-blown and ruddy as St. Agnes’ nipple,
Plump as the flesh-bunch on some Turk bird’s poll!
Be sure if corals, branching ’neath the ripple
Of ocean, bud there,—fairies watch unroll
Such turban-flowers; I say, such lamps disperse
Thick red flame through that dusk green universe!
I am queen of thee, floweret!
And each fleshy blossom
Preserve I not—(safer
Than leaves that embower it,
Or shells that embosom)
—From weevil and chafer?
Laugh through my pane then; solicit the bee;
Gibe him, be sure; and, in midst of thy glee,
Love thy queen, worship me!

—Worship whom else? For am I not, this day,
Whate’er I please? What shall I please to-day?
My morn, noon, eve and night—how spend my day?
To-morrow I must be Pippa who winds silk,
The whole year round, to earn just bread and milk:
But, this one day, I have leave to go,
And play out my fancy’s fullest games;
I may fancy all day—and it shall be so—
That I taste of the pleasures, am called by the names
Of the Happiest Four in our Asolo!

See! Up the hillside yonder, through the morning,
Some one shall love me, as the world calls love:
I am no less than Ottima, take warning!
The gardens, and the great stone house above,
And other house for shrubs, all glass in front,
Are mine; where Sebald steals, as he is wont,
To court me, while old Luca yet reposes:
And therefore, till the shrub-house door un-closes,
I ... what now?—give abundant cause for prate
About me—Ottima, I mean—of late,
Too bold, too confident she’ll still face down
The spitefullest of talkers in our town.
How we talk in the little town below!
But love, love, love—there’s better love, I know!
This foolish love was only day’s first offer;
I choose my next love to defy the scoffer:
For do not our Bride and Bridegroom sally
Out of Possagno church at noon?
Their house looks over Orcana valley:
Why should not I be the bride as soon
As Ottima? For I saw, beside,
Arrive last night that little bride—
Saw, if you call it seeing her, one flash
Of the pale snow-pure cheek and black bright tresses,
Blacker than all except the black eyelash;
I wonder she contrives those lids no dresses!
—So strict was she, the veil
Should cover close her pale
Pure cheeks—a bride to look at and scarce touch,
Scarce touch, remember, Jules! For are not such
Used to be tended, flower-like, every feature,
As if one’s breath would fray the lily of a creature?
A soft and easy life these ladies lead:
Whiteness in us were wonderful indeed.
Oh, save that brow its virgin dimness,
Keep that foot its lady primness,
Let those ankles never swerve
From their exquisite reserve,
Yet have to trip along the streets like me,
All but naked to the knee!
How will she ever grant her Jules a bliss
So startling as her real first infant kiss?
Oh, no—not envy, this!

—Not envy, sure!—for if you gave me
Leave to take or to refuse,
In earnest, do you think I’d choose
That sort of new love to enslave me?
Mine should have lapped me round from the beginning;
As little fear of losing it as winning:
Lovers grow cold, men learn to hate their wives,
And only parents’ love can last our lives.
At eve the Son and Mother, gentle pair,
Commune inside our turret: what prevents
My being Luigi? While that mossy lair
Of lizards through the winter-time is stirred
With each to each imparting sweet intents
For this new-year, as brooding bird to bird—
(For I observe of late, the evening walk
Of Luigi and his mother, always ends
Inside our ruined turret, where they talk,
Calmer than lovers, yet more kind than friends)
—Let me be cared about, kept out of harm,
And schemed for, safe in love as with a charm;
Let me be Luigi! If I only knew
What was my mother’s face—my father, too!
Nay, if you come to that, best love of all
Is God’s; then why not have God’s love befall
Myself as, in the palace by the Dome,
Monsignor?—who to-night will bless the home
Of his dead brother; and God bless in turn
That heart which beats, those eyes which mildly burn
With love for all men! I, to-night at least,
Would be that holy and beloved priest.

Now wait!—even I already seem to share
In God’s love: what does New-year’s hymn declare?
What other meaning do these verses bear?
