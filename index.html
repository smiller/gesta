<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gesta</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* the page's own chrome — phase 3 replaces this with the Svelte masthead */
  .bar { font: 14px/1.4 -apple-system, system-ui, sans-serif; background: #1e3320; color: #eef1e0; padding: 8px 32px; display: flex; gap: 1.5em; align-items: center; flex-wrap: wrap; }
  .bar strong { font-weight: 600; }
  .bar select, .bar input { font: inherit; }
  details { font: 13px/1.4 -apple-system, system-ui, sans-serif; margin: 2rem 32px; color: #6b7568; }
  details pre { font: 13px/1.4 ui-monospace, Menlo, monospace; white-space: pre-wrap; color: #1a2418; }
  #same.no { color: #900; }
</style>
</head>
<body>
<header class="bar">
  <strong>Gesta — phase 1: the editor</strong>
  <label>Fixture <select id="fixture">
    <option value="horace">Horace, Odes 1.1 (paired)</option>
    <option value="pippa">Browning, Pippa Passes (directions and songs)</option>
    <option value="twelfth">Shakespeare, Twelfth Night 1.1 (speakers and directions)</option>
  </select></label>
  <label>or a .md file <input id="file" type="file" accept=".md,text/markdown"></label>
  <label>Line numbering <select id="interval">
    <option value="0">none</option>
    <option value="1">every line</option>
    <option value="5" selected>every 5</option>
    <option value="10">every 10</option>
  </select></label>
</header>
<main><div id="editor"></div></main>
<details><summary>the markdown the editor holds <span id="same"></span></summary><pre id="out"></pre></details>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
