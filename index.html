:::`,twelfth:`# Act 1, Scene 1. DUKE ORSINO’s palace.

::: verse
*Enter DUKE ORSINO, CURIO, and other Lords; Musicians attending*

**DUKE ORSINO**
If music be the food of love, play on;
Give me excess of it, that, surfeiting,
The appetite may sicken, and so die.
That strain again! it had a dying fall:
O, it came o’er my ear like the sweet sound,
That breathes upon a bank of violets,
Stealing and giving odour! Enough; no more:
’Tis not so sweet now as it was before.
O spirit of love! how quick and fresh art thou,
That, notwithstanding thy capacity
Receiveth as the sea, nought enters there,
Of what validity and pitch soe’er,
But falls into abatement and low price,
Even in a minute: so full of shapes is fancy
That it alone is high fantastical.

**CURIO**
Will you go hunt, my lord?

**DUKE ORSINO**
What, Curio?

**CURIO**
The hart.

**DUKE ORSINO**
Why, so I do, the noblest that I have:
O, when mine eyes did see Olivia first,
Methought she purged the air of pestilence!
That instant was I turn’d into a hart;
And my desires, like fell and cruel hounds,
E’er since pursue me.

*Enter VALENTINE*

How now! what news from her?

**VALENTINE**
So please my lord, I might not be admitted;
But from her handmaid do return this answer:
The element itself, till seven years’ heat,
Shall not behold her face at ample view;
But, like a cloistress, she will veiled walk
And water once a day her chamber round
With eye-offending brine: all this to season
A brother’s dead love, which she would keep fresh
And lasting in her sad remembrance.

**DUKE ORSINO**
O, she that hath a heart of that fine frame
To pay this debt of love but to a brother,
How will she love, when the rich golden shaft
Hath kill’d the flock of all affections else
That live in her; when liver, brain and heart,
These sovereign thrones, are all supplied, and fill’d
Her sweet perfections with one self king!
Away before me to sweet beds of flowers:
Love-thoughts lie rich when canopied with bowers.

*Exeunt*
:::`,williams:`# 3. The Dark Ages

The development of the idea of the Devil was the subordinate centre of the whole great transmutation of general supernatural power into the two schools of divine and anti-divine power.  But the Devil, whether as angel or as blackamoor, was not alone.  Other demons were with him, and the shapes and images, whether of demons or of witches.  The Egyptian desert had been full of them, rather diabolic than sorcerous.  Certain kinds of beasts were already particularly associated with them — goats, cats, all vermin.  But there were also other strange creatures who, in the folk-fables or the inventions of poets, had been used as images of destructive power, and the names of them hovered for long over Christendom.  Thus there was a particular kind of being known as Lamia, who was known originally to classical tradition, but the name of her, being drawn into the Vulgate, became a general title for some of those organisms of hell.  Lamia was a queen of Libya, and she had been loved by Zeus, but the jealousy of Hera had slain her children, and Lamia in despite and malice ⟨61⟩robbed other mothers of theirs.  She tore them with her nails or else she sucked their blood, and presently the cruelty of her blood-lust changed her face from the beauty which Zeus had loved to mere bestiality.  And though there was only one of her, yet there were many of her; the horrible mad figure of creatures neither quite woman nor quite beast wandered through the night.  Witches were like the Lamia; they were *lamiae*, for it was an old belief that witches sucked blood from the living, from living children; they were like vampires in that, though they were not vampires, for their powers were greater.  The *lamiae* could take again the appearance of beautiful young women, the shape, as it were, of the Lamia whom Zeus had loved.

The most famous story of these (a story made more famous by Keats) occurs in the life of Apollonius, the philosopher of Tyana.  A young Corinthian met upon the highway “a ghost which took the shape of a woman”, who made love to him and whose lover he became.  It was Apollonius who at the wedding banquet denounced her.  “Madam the bride is an Empusa, such as are commonly called Lamias.  They have amorous appetites, but their chief appetite is for human flesh, and they ensnare their intended victims with the bait of love.”  In Keats she dies, but in the original she confesses her true nature: “her wont was to feed upon young and beautiful bodies, because their blood was fresh and pure.”

The name was introduced into the Vulgate by the translators, into a verse of Isaiah (xxxiv. 14): “ibi cubavit lamia et invenit suam requiem”.  It was used as the nearest Latin for the name of another terror in the Jewish ⟨62⟩tradition, the name Lilith.  The translators were not far wrong, for Lilith was the first wife of Adam and (as some said later) the daughter of Samael the accursed; she was driven from Adam because she would not obey him, and she too is a dangerous lover and a murderess of children.  She, however, became a queen of devils, which the Lamia did not, and she did not take on a bestial face, which the Lamia did.  But it is thus from both sides that the idea of the woman of the darkness who loves and kills entered Christian mythology.

In Isaiah the Lamia is named among other monsters — demons and centaurs of ass-form and satyrs.  The Authorized Version has for “lamia”, “screech-owl”; the Revised has “night-monster”.  The Authorized Version seems here to have confused the lamia with another creature of the night, the screech-owl proper, or at least improper, the Roman strix.  This also was said to suck the blood of children; it was related to sorcery, its cry was a malediction, and its feathers magical.  Both the lamia and the strix were popular shapes in the “nightmare of the spirit”; both were shapes of demons, therefore shapes of the followers of demons, therefore shapes of those supposed to be followers of demons.  The night was given up to its riders, and these were among them.

But the night had other riders also.  In an age when the high air has become unfriendly to us, it should not be difficult to understand the feeling of those earlier centuries.  They too feared and set watches against the noise of hordes by night; only their fear was, in a way, worse than ours, because we know our enemies and they did not know theirs.  The danger was concealed — in ⟨63⟩the street; nay, nearer, in the home.  It is not true to think that it was only poor old women who fell under suspicion; beautiful women, noble men, priests, were quite as likely to be centres of doubt and mistrust.  Doctrine and literary tradition and popular rumours mingled in the general mind; and the roar of the wind at night — or of more than the wind — stirred everywhere an ancestral terror.  In the old days, gods, of one kind or another, had passed through the air, and among them had been Diana the night-huntress.  Another invention had grown up in Christian times; the moralists recounted, for edification, tales of great hosts met upon country roads, the damned pouring towards hell.  The screech-owl, the lamia, the ghost, the lost soul, the demon, these transported themselves by night.  It was not long, as these things go, before all these began to draw together; it was not even long before men and women began to hint at what they knew of such things, what they could say if they would — before little brags and secret boasts began to be heard.  Men must be interesting to themselves, and therefore necessarily to others; very few men and women can nourish themselves only on their own self-interest.  The Christian religion, on the whole, tends to discourage self-interest and self-importance; against that discouragement there are two methods of fighting — one is to go on being interested in oneself under cover of that religion; the other, to go on being interested in oneself under cover of another religion.  The desire for self-importance which had caused many fools in earlier times to nourish themselves on their neighbours’ envy and fear, the ⟨64⟩secret satisfaction of pride, passed over, with so much else, into the Church.  It was not the orthodox alone who took a thrill from the thought that X was indeed a witch.

Transmutation of bodies remained a frequent thing — at least in fable.  It may reasonably be doubted how many actual men and women through all the centuries of Rome were transformed into beasts, but at least the myths were full of such tales.  The taking-up of these tales by the Christian Fathers, for whatever purpose, gave them a validity they might not otherwise have had.  Thus the *City of God*, in the short history of the world given in the thirteenth and fourteenth books, collects a number which, if it does not say they are credible, it yet does not declare to be incredible.  For when, after speaking of Diomedes and his followers turned into birds, and of Circe, and of the Arcadians turned into wolves by swimming a certain lake, and of the power of Pan and Jupiter to turn men into wolves, it turns to the new metaphysic, it goes on to discuss whether the Devil has any power of this kind.  Augustine refers again to the *Golden Ass* of Apuleius, and he says he has himself heard a report that women of a certain place in Italy know of a drug which they will sometimes give, concealed in cheese, and whoever eats it becomes an ass and carries burdens, but still retaining his human reason, and being re-transformed at the end.  He does not give this on general rumour alone; he says he talked with a man whose father had undergone the magic, “one Praestantius”.  The victim “took the drug in cheese at his own house, whereupon he lay in such a sleep that no man could awake him; and after a few days he awoke ⟨65⟩of himself and told all he had suffered in his dreams in the meanwhile, how he had been turned into a horse and carried the soldiers” victuals about in a budget.  Which was true as he told, yet seemed it but a dream unto him.’  Another tale was of an actual personal experience.  A friend of Augustine’s related that he had asked a certain philosopher, an old acquaintance of his, to explain certain “Platonisms” to him while they were together in the philosopher’s house.  The man refused at the time, but afterwards just before Augustine’s friend went to sleep one night, in came the philosopher and did as he had been entreated.  The next day, asked why he had done then what he would not do before, he answered: “I did it not; indeed I dreamed I did it.”  Augustine is a little uncertain of the explanation.  His sense of the omnipotence of God and the dignity of man does not allow him to believe that the devils can either create or can really change men “from any soul or body into bestial or brutal members or essences”.  If such things happen, they are due to diabolic action in the following manner.  Men have certain fantasies in their minds, and what the Devil can do is to induce deep sleep in a man, while they themselves “transport the phantasy to other senses”.  The dream having occurred, the devils can themselves, in the shape of the dream, appear elsewhere, and even themselves do the actual corporeal work of the dream.  Why they should do so, Augustine does not very clearly explain; except that it is “to delude men’s eyes”.  It would seem, even so, that the women who gave the drug in the cheese must have been of the nature of witches, since (whatever they themselves believed) ⟨66⟩they must have taken advantage of supernatural spells.

Here, however, we have a point of view which was to become, in part at least, for some centuries the official explanation of the Church.  But it was not against the haunted sky of the Mediterranean alone that the Christian doctors maintained their protest, offered their explanation, or issued their defiance.  There had been, while the City stood, a kind of repugnance to all this — the repugnance of Lucan, of Philostratus.  These lucid minds might accept astrology and the knowledge of great cycles of events, learned through much care, vigil, and noble practices of the soul; as when Philostratus makes his Apollonius define magical science as “divination, and how to pray and worship the gods”.  But they did not conceive that you could, or should, buy from a sorcerer for money the name of the winner in the two o’clock or an aphrodisiac philtre for the cruel beloved.  The distinction might not be altogether logical, but it was at least gentlemanly.  A gentleman might study the influence of the stars to discover the future or not, but he did not allow himself to hire the supernatural in order to gain an advantage over his fellows, nor did he traffic in curses, in poisons, in necromancy, or in human sacrifice.  Neither Apollonius nor Apuleius would have thought it decent to take part in a magical and cannibal feast; how much less Porphyry or the Emperor Julian himself!  But now, from outside the contracting Empire, precisely these evils began to reinforce the more disgusting evils within.

Here again the first thing that strikes the reader is ⟨67⟩precisely the *commonness* of the idea, and here again twenty centuries of Christianity have removed that ordinariness from our understanding.  Even if we do not think sorcery, human sacrifice, and cannibalism wrong, we still do not think them common.  On the rare occasions when something of the sort — or as near it as comes out — appears in the Law Courts, the judges are obviously astonished and even bewildered.  It is true that they are so often bewildered, or allow themselves to be, at ordinary human behaviour, that one cannot press that too far.  But in general the thing is true; the dark rituals are not an accepted thing, and are punishable (if at all) by fine and imprisonment — certainly not by death.

In the movement of the peoples that then surrounded the Empire they were exactly that.  It is true that frightened minds attributed the very birth of some of the invaders to art magic.  The Goths held the still more terrifying Huns to be the children of sorceresses and unclean spirits, spirits who wandered in the marshes of Asia, small and emaciated, and having only “the shadow of human speech”.  The coming of Attila seemed the coming of a lord of sorcery, especially because of the number of magicians who accompanied him.  Before his battle with Actius, “Attila assembled the sorcerers.  There in a great tent lit by torches gathered together a council of magicians; the Ostrogothic aruspice, his hands plunged into the entrails of the victim whose palpitations he watched; the Alaric priest shaking in a white flag his divination sticks, according to the interminglings of which he read out their prophecies; the Hunnish sorcerer whirling round beating a drum and ⟨68⟩evoking the spirits of the dead until, with foaming lips, he rolled over exhausted and grew rigid in catalepsis; while at the far end of the tent sat Attila on his stool, watching these convulsions and listening to every cry of these interpreters of hell.”

::: note
Quoted from Jornandes by Major-Gen.  J.  F.  C.  Fuller, *Decisive Battles*, vol. i.
:::

Against such groupings the groupings of the high officers of the Church themselves seemed half-magical.  The Pope Leo I, when he met Attila and saved Rome, came as a form of enchantment — robes and chants and incense.  There went with him on each side great supernatural figures, guardians of the City, princes of power, holy Peter and holy Paul, visible (it was said) to human eyes.  Attila half yielded to and half compromised with the power of a greater sorcerer than himself, and allowed terms of peace to be imposed upon him.  Sometimes the Pope himself had to compromise, as when Pope Innocent was compelled by the passionate anxiety of the people of Rome to allow Etruscan augurs publicly to work divination in the Forum.

But also there was the mass of secret, and yet open, dealing with the black arts which was so private as to kill a man by enchantment and so widespread as to be generally recognized in the penal codes.  As the Church mastered the peoples, so the ecclesiastical government, like the secular, made rules against all such practices.  It was not, however, recognized as different in kind from any other sin — even from the sin of false accusation of witchcraft.  The Salic Law of Charlemagne decreed that anyone who was convicted of witch-cannibalism ⟨69⟩should be heavily fined, but also that anyone who was found guilty of bringing such an accusation falsely should be fined an amount equal to about one-third of the other.  Incantations of all kinds were denounced everywhere; so was the making of images to bring harm on the original.  “An actual case of such a murder is mentioned in an Anglo-Saxon charter of c. 963-75.  A certain widow and her son had forfeited an estate at Ailsworth, Northamptonshire, ‘because they drove iron nails into Alsi, Wolfstan’s father’.  The image was apparently discovered in the woman’s chamber.  She was drowned at London Bridge and her son fled and was outlawed.”

::: note
Kittredge, *Witchcraft in Old and New England*.
:::

Three years’ penance was ordered for such offences if the magic failed, seven years if it succeeded and the victim died (of which years three were to be a fast on bread and water).  Periods of penance of differing length were laid down — one year’s penance for those who offered at wells and trees; five years for one who drove a man out of his right mind by the help of demons; seven years for those who raised storms; ten years for those who had great commerce with evil spirits.  King Canute ordered banishment or death for all “wizards, witches, soothsayers, perjurers, secret murderers (probably by enchantment), and harlots”, unless they altered their lives and did what they could to make amends.  He also included in one proclamation the word *walcyries* for witches; it was not the gods of Greece only who rode dangerously through the air by night, but more and more the “gods of folk”, they who “all beth ⟨70⟩fenders, and they beth yclept strange gods, other alyen gods.”

::: note
Kittredge, *Witchcraft in Old and New England*.
:::

But did they?  This is not a modern but a contemporary question.  All over the Empire the Church had found itself confronted with such beliefs, and as its own dominions increased, as it conquered (if it did not wholly convert) the tribes and peoples, it still found itself confronted by the same ideas and the same tales.  In the northern parts of Europe witches raised and subdued storms; they tied winds in knots and hung them on the masts of ships; in the more southern parts the more amorous attention of young men and maidens sought for philtres — the distinction is not absolute but it existed as a tendency of division.  But malice was everywhere.  The Church, it is now clear, was then fighting much more violently against Goetia than against almost anything else.  She did not invent Goetia; that was there already.  But so was the tendency to scepticism, “the quality of disbelief”, and this was converted as belief in the old gods had been converted.  The Devil having been developed, it could hardly be denied that he and his friends and worshippers could do (under the Permission) very remarkable things.  But they were also very severely limited.  The malice of men and women was unbounded.  But it was impossible to believe that the practice of that malice was also unbounded.  Saint Augustine had checked his belief over the matter of the maidens of Italy.  By the end of the Dark Ages an accident — or what seems to us an accident — determined for centuries the formal law of the Church.

⟨71⟩The bishops did their best by examinations to check not only Goetia but belief in Goetia.  Just as under Charlemagne it was an offence to be a witch and an offence to say, untruly, that anyone was a witch; that is, just as accusations as well as sorceries were discouraged, so the bishops, with intellectual inconsistency perhaps but with the best possible intentions, often attempted to discourage both sorcery and belief in sorcery.  “Si credidisti aut particeps fuisti” is a recurrent phrase; “if thou hast believed or taken part in”.  It might possibly be argued that “credidisti” implied an active intelligent consent to the sin, but then sometimes the word is used alone.  There is, for instance, a very stringent interrogatory against belief in werewolves, which begins: “Hast thou believed as some are accustomed to believe that those who by the vulgar are called *parcae* are able to do what they are believed to do … namely so to affect a man at birth that afterwards when he chooses he can transform himself into a wolf [“quod vulgaris stultitia werwolff vocat”] or into any other form?  Or, that you could yourselves change?’  And if you have believed that this is done or “that the divine image can be changed into any other form or species by any other power than by Almighty God”, you shall do penance for ten days on bread and water.  Another interrogatory inquired whether any women had got ready a table with meat and drink and three knives, in case those three sisters should come “who were by ancient folly called the *parcae*”; penance was to last a year on lawful feast-days.  And so for those who thought that they could harm poultry and pigs either by incantation or by the evil ⟨72⟩eye.  There, however, is obviously a point at which belief and act come very near together.  In fact, the authorities seem rather to have taken the view that to believe that anyone could do it, to believe that one could oneself do it, and to do it were three degrees of preoccupation with the same evil.  They were concerned to change the whole form of the invisible world; they were concerned to direct the attention of the visible world to Christ.  There were two ways of doing so, and the mind of the ecclesiastical rulers swung between them.  One was to prevent people thinking about Goetia; the other was to frighten them with the Devil that lay behind Goetia.

There was in the diocese of Prum a bishop in the tenth century by the name of Regino.  He drew up a number of interrogatories and he also made a collection of what may be called Rules on the subject.  He included one which he attributed to a certain Council, or Synod, of Ancyra.  It seems that the attribution is incorrect.  It was not, however, the rule’s past, but its future, which became important.  For it was taken up by other collectors, and presently when Gratian, the first great editor of Canon Law, drew up his own work, this canon — the *Canon* or *Capitulum Episcopi*, as it was called — found a place there.  Gratian’s collection became, about 1234, the accepted law of the Church, and so therefore did the *Canon Episcopi*.  It ran as follows:

::: note
The translation is by H.  C.  Lea, from *Materials towards a History of Witchcraft*.
:::

> “Bishops and their officials must labor with all their ⟨73⟩strength to uproot thoroughly from their parishes the pernicious art of sorcery and malefice invented by the Devil, and if they find a man or woman follower of this wickedness to eject them foully disgraced from their parishes.  For the Apostle says, ‘A man that is a heretic after the first and second admonition avoid.’  Those are held captive by the Devil who, leaving their creator, seek the aid of the Devil.  And so Holy Church must be cleansed of this pest.  It is also not to be omitted that some wicked women, perverted by the Devil, seduced by illusions and phantasms of demons, believe and profess themselves, in the hours of night, to ride upon certain beasts with Diana, the goddess of pagans,[11] and an innumerable multitude of women, and in the silence of the dead of night to traverse great spaces of earth, and to obey her commands as of their mistress, and to be summoned to her service on certain nights.  But I wish it were they alone who perished in their faithlessness and did not draw many with them into the destruction of infidelity.  For an innumerable multitude, deceived by this false opinion, believe this to be true, and so believing, wander from the right faith and are involved in the error of the pagans when they think that there is anything of divinity or power except the one God.  Wherefore the priests throughout their churches should preach with all insistence to the people that they may know this to be in every way false and that such phantasms are imposed on the minds of infidels and not by the divine but by the malignant spirit.  Thus ⟨74⟩Satan himself, who transfigures himself into an angel of light, when he has captured the mind of a miserable woman and has subjugated her to himself by infidelity and incredulity, immediately transforms himself into the species and similitudes of different personages and deluding the mind which he holds captive and exhibiting things, joyful or mournful, and persons, known or unknown, leads it through devious ways, and while the spirit alone endures this, the faithless mind thinks these things happen not in the spirit but in the body.  Who is there that is not led out of himself in dreams and nocturnal visions, and sees much when sleeping which he had never seen waking?  Who is so stupid and foolish as to think that all these things which are only done in spirit happen in the body, when the Prophet Ezekiel saw visions of the Lord in spirit and not in the body, and the Apostle John saw and heard the mysteries of the Apocalypse in the spirit and not in the body, as he himself says ‘I was in the spirit’?  And Paul does not dare to say that he was rapt in the body.  It is therefore to be proclaimed publicly to all that whoever believes such things or similar to these loses the faith, and he who has not the right faith in God is not of God but of him in whom he believes, that is, of the Devil.  For of our Lord it is written ‘All things were made by Him.’  Whoever therefore believes that anything can be made, or that any creature can be changed to better or to worse or be transformed into another species or similitude, except by the Creator himself who made everything and through whom all things were made, is beyond doubt an infidel.”

⟨75⟩This was the great achievement of the “quality of disbelief”.  It applied chiefly to the riding by night; other credulities were not so firmly and canonically reproved.  It was not entirely consistent with itself, nor perhaps with the Christian Faith, for it might be thought to involve a suggestion that the body was not capable of heavenly things.  But even if all that is allowed, it has a nobility of effort in it.  Unfortunately the great vision of the One Mover could not be adequately communicated to all the men and women of Europe.  The Church, three centuries after, went back on its own law.  But it must be admitted that the inquisitive and iniquitous minds of a rumoured Goetia had made nonsense of it first.`,ovid:`# Book 1 (lines 348–380, 525–600, 682–712)
